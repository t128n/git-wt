[package]
name = "git-wt"
version = "0.0.1"
edition = "2024"
description = "A simpler interface to git worktrees"
license = "MIT"
authors = ["t128n"]
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
